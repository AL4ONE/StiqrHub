version: '3.8'

services:
  stiqrhub-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stiqrhub-fe-prod
    ports:
      - "80:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - stiqrhub-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  stiqrhub-network:
    driver: bridge
